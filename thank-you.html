<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#061a3a" />
  <meta name="robots" content="noindex" />
  <title>Thank You | Vaultara Capital</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; color: white; background: radial-gradient(circle at 80% 20%, #0a68e8, transparent 32%), #061a3a; }
    .thanks { width: min(620px, 100%); padding: clamp(32px, 7vw, 64px); border: 1px solid rgba(255,255,255,.2); border-radius: 28px; background: rgba(3,17,39,.78); text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.3); }
    .thanks .wordmark { justify-content: center; color: white; margin-bottom: 40px; }
    .thanks-icon { display: grid; place-items: center; width: 78px; height: 78px; margin: 0 auto 24px; border-radius: 50%; background: #bdf4e7; color: #061a3a; font-size: 34px; font-weight: 900; }
    .thanks h1 { margin: 0; font: 900 clamp(42px, 9vw, 64px)/1 Georgia, serif; letter-spacing: -2px; }
    .thanks p { margin: 20px auto 30px; color: rgba(255,255,255,.72); }
  </style>
</head>
<body>
  <main class="thanks">
    <a class="wordmark" href="/"><span class="wordmark-mark">V</span><span><strong>Vaultara</strong><small>Capital</small></span></a>
    <div class="thanks-icon" aria-hidden="true">✓</div>
    <h1>Thank you.</h1>
    <p>Your request has been received. A Vaultara Capital representative can follow up using the contact information you provided.</p>
    <a class="button button-light" href="/">Return to the homepage</a>
  </main>
</body>
</html>
